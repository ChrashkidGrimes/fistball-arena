name: Deploy staging (Firebase Hosting)

# Every merge to main goes to STAGING first: the app on Firebase Hosting of
# the separate staging project, plus its Firestore rules and indexes.
# Production is deployed separately (deploy.yml) — see docs/staging.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
    steps:
      - name: Staging configured?
        if: env.FIREBASE_SA == ''
        run: echo "::notice::Staging is not set up yet (secret FIREBASE_SERVICE_ACCOUNT_STAGING missing) — skipping. See docs/staging.md."

      - uses: actions/checkout@v4
        if: env.FIREBASE_SA != ''

      - uses: actions/setup-node@v4
        if: env.FIREBASE_SA != ''
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.FIREBASE_SA != ''

      - name: Build (staging config)
        if: env.FIREBASE_SA != ''
        run: |
          npm run build
          echo "{\"stage\":\"staging\",\"commit\":\"$GITHUB_SHA\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > dist/version.json
        env:
          VITE_STAGE: staging
          VITE_FIREBASE_API_KEY: ${{ vars.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.STAGING_FIREBASE_APP_ID }}
          VITE_ORG_ADMINS: ${{ vars.STAGING_ORG_ADMINS }}

      - name: Deploy app, Firestore rules and indexes to staging
        if: env.FIREBASE_SA != ''
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15.32.1 deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project "${{ vars.STAGING_FIREBASE_PROJECT_ID }}" --non-interactive \
            --message "staging ${GITHUB_SHA::7}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
